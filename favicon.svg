<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0b0f19"/>
  <!-- Outer Shield -->
  <path d="M50 15 L78 26 C78 54 50 78 50 85 C50 78 22 54 22 26 Z" 
        fill="url(#shieldGrad)" opacity="0.18"/>
  <path d="M50 15 L78 26 C78 54 50 78 50 85 C50 78 22 54 22 26 Z" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)"/>
  <!-- Ethereum Rhombus -->
  <polygon points="50,28 35,50 50,42" fill="#ffffff" opacity="0.9"/>
  <polygon points="50,28 65,50 50,42" fill="#a5b4fc" opacity="0.95"/>
  <polygon points="50,45 35,53 50,72" fill="#ffffff" opacity="0.8"/>
  <polygon points="50,45 65,53 50,72" fill="#818cf8" opacity="0.85"/>
</svg>
